name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: "3.12.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.11"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12.14

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Exact toolchain gate
        run: |
          python_version="$(uv run python --version 2>&1)"
          forge_version="$(forge --version | head -n1)"
          solc_version="$(solc --version 2>/dev/null || true)"
          echo "$python_version"
          echo "$forge_version"
          test "$python_version" = "Python 3.12.14"
          echo "$forge_version" | grep -F "1.7.1"

      - name: Lockfile check
        run: uv lock --check

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Official Track04 submission format gate
        run: node trust404/scripts/validate-submission.mjs .

      - name: Prime benchmark Solidity compiler cache
        run: forge build --root benchmarks/foundry

      - name: Python tests
        run: uv run pytest -q

      - name: Install pinned Track04 forge-std
        run: |
          rm -rf trust404/harness/lib/forge-std
          mkdir -p trust404/harness/lib/forge-std
          git -C trust404/harness/lib/forge-std init -q
          git -C trust404/harness/lib/forge-std remote add origin https://github.com/foundry-rs/forge-std
          git -C trust404/harness/lib/forge-std fetch --depth 1 origin bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
          git -C trust404/harness/lib/forge-std checkout --detach FETCH_HEAD

      - name: Track04 Foundry harness
        run: |
          forge build --root trust404/harness
          forge test --root trust404/harness -q

      - name: One-command Track04 demo
        run: |
          rm -rf trust404/results/latest
          uv run qprover track04 --json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("trust404/results/latest/result.json").read_text(encoding="utf-8")
          )
          assert result["status"] == "PROVEN"
          assert result["proof"]["organizer_harness_reproduced"] is True
          assert result["violated_invariant"] == "flagRemainsFalse"
          PY

      - name: Foundry fixture tests
        run: forge test --root benchmarks/foundry -vv

      - name: Production hardcoding gate
        run: |
          ! grep -R -n -E             'OpenVault|BadAccounting|NaiveOracle|ReentrantVault|SafeVault|BoundedOwner'             src/qprover trust404/harness/src

      - name: Doctor
        run: uv run qprover doctor --json

      - name: Autonomous demo
        run: |
          rm -rf /tmp/qprover-demo-core
          uv run qprover demo --json --out /tmp/qprover-demo-core

  track04-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.11"

      - name: Install Python
        run: uv python install 3.12.14

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Install pinned Track04 forge-std
        run: |
          rm -rf trust404/harness/lib/forge-std
          mkdir -p trust404/harness/lib/forge-std
          git -C trust404/harness/lib/forge-std init -q
          git -C trust404/harness/lib/forge-std remote add origin https://github.com/foundry-rs/forge-std
          git -C trust404/harness/lib/forge-std fetch --depth 1 origin bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
          git -C trust404/harness/lib/forge-std checkout --detach FETCH_HEAD
          forge build --root trust404/harness

      - name: Run one-command Track04 demo
        run: uv run qprover track04 --json

  submission-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build exact submission image
        run: docker build -f agent/Dockerfile -t qprover-track04-ci .

      - name: Verify image offline toolchain
        run: |
          docker run --rm --network=none --entrypoint sh qprover-track04-ci -lc '
            set -eu
            test "$(python --version 2>&1)" = "Python 3.12.14"
            forge --version | head -n1 | grep -F "1.7.1"
            solc --version | grep -F "0.8.24"
            test -f /opt/qprover/trust404/harness/out/SearchAttacker.sol/SearchAttacker.json
            python -c "import qprover.trust404_runner; print(\"OFFLINE_IMPORT_OK\")"
            forge test --root /opt/qprover/trust404/harness -q
            /opt/qprover/.venv/bin/qprover track04 --workspace /opt/qprover --json
            test -f /opt/qprover/trust404/results/latest/result.json
            test -f /opt/qprover/trust404/results/latest/Exploit.sol
          '
