[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qprover"
version = "0.1.0"
description = "Optimization-guided smart-contract exploit prover"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25,<5",
  "networkx>=3.4,<4",
  "pydantic>=2.12,<3",
  "web3>=7.14,<8",
  "z3-solver>=4.15,<5",
]

[project.scripts]
qprover = "qprover.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.140,<7",
  "pytest>=8.4,<9",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
